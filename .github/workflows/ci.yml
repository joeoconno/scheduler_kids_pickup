name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: habitharmony
          POSTGRES_PASSWORD: habitharmony
          POSTGRES_DB: habitharmony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitharmony"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://habitharmony:habitharmony@localhost:5432/habitharmony
      AUTH_SECRET: ci-only-dummy-secret-not-used-in-prod
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Validate Prisma migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
